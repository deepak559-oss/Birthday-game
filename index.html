<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Birthday Game 🎉💗</title>

  <!-- Cute fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #fff0f7;
      --bg2: #ffeaf2;
      --accent: #ff4da6;
      --card:#ffffffc9;
      --shadow: rgba(255,77,166,0.15);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Poppins', 'Baloo 2', sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      color: #44233a;
      text-align:center;
      min-height:100vh;
      padding:24px;
    }
    header{margin-bottom:10px;}
    h1{
      font-family:'Baloo 2';
      font-size:36px;
      margin:8px 0;
      color: var(--accent);
    }
    .subtitle{
      font-size:15px;
      margin:0 0 18px;
      color:#6d4159;
    }

    #game-area{ max-width:900px; margin:0 auto; padding:16px;}
    .stage{ display:none; }
    .stage.active{ display:block; }

    .grid{
      display:grid;
      gap:12px;
      justify-content:center;
      margin:0 auto;
      padding:8px;
    }
    .grid.grid-4{grid-template-columns: repeat(4, minmax(60px, 90px));}

    .card{
      width:100%;
      aspect-ratio:1/1;
      background:var(--card);
      border-radius:12px;
      box-shadow: 0 8px 18px var(--shadow);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      cursor:pointer;
      position:relative;
      transform-style:preserve-3d;
      transition: transform .45s;
      user-select:none;
    }
    .card.flipped{ transform: rotateY(180deg); }

    .card .face{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      backface-visibility:hidden;
    }
    .card .front{
      background:#fff;
      font-size:36px;
    }
    .card .back{
      transform: rotateY(180deg);
      background:#fff7fb;
      font-size:34px;
    }

    .info{
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .chip{
      background:#fff;
      padding:8px 12px;
      border-radius:999px;
      box-shadow:0 6px 14px rgba(0,0,0,0.06);
      font-size:14px;
      color:#5d374a;
    }
    .btn {
      background: linear-gradient(90deg,#ff7ab3,#ff4da6);
      color:white;
      border:none;
      padding:10px 16px;
      border-radius:12px;
      font-weight:600;
      cursor:pointer;
    }

    .grid.grid-6{grid-template-columns: repeat(6, minmax(40px, 64px));}
    .small-emoji{
      font-size:26px;
      padding:8px;
      background:#fff;
      border-radius:10px;
      box-shadow:0 6px 12px rgba(0,0,0,0.05);
      cursor:pointer;
    }

    #arena{
      position:relative;
      height:420px;
      margin:14px auto;
      background:#fff7fb;
      border-radius:16px;
      overflow:hidden;
    }
    .floating{
      position:absolute;
      font-size:28px;
      user-select:none;
      cursor:pointer;
    }

    #finalScreen{ display:none; padding:18px; }
    .finalCard{
      background:#fff;
      padding:20px;
      border-radius:16px;
      box-shadow:0 10px 20px rgba(0,0,0,0.06);
      display:inline-block;
    }
    .finalText{
      font-family:'Baloo 2';
      font-size:28px;
      color:#c72b74;
    }

    .sparkle{
      position:fixed;
      pointer-events:none;
      font-size:18px;
      opacity:0.9;
      z-index:9999;
    }
  </style>
</head>

<body>
<header>
  <h1>🎉 Cute Birthday Quest 🎉</h1>
  <div class="subtitle">3 cute + hard levels 💗</div>
</header>

<main id="game-area">

  <div class="info">
    <div class="chip" id="levelChip">Level 1</div>
    <div class="chip" id="movesChip">Moves: 0</div>
    <div class="chip" id="timerChip" style="display:none">Time: 00:00</div>
    <button class="btn" id="resetBtn" onclick="restartAll()">Restart</button>
  </div>

  <!-- LEVEL 1 -->
  <section id="level1" class="stage active">
    <h2 style="font-size:20px;color:#6d4159;margin:8px 0">Level 1 — Memory Match (8 pairs)</h2>
    <div id="grid1" class="grid grid-4"></div>
    <button class="btn" id="nextTo2Btn" style="display:none;margin-top:12px;">Go to Level 2</button>
  </section>

  <!-- LEVEL 2 -->
  <section id="level2" class="stage">
    <h2 style="font-size:20px;color:#6d4159;margin:8px 0">Level 2 — Find the exact emoji</h2>
    <p>Find: <strong id="targetLabel">🎂</strong></p>
    <div id="grid2" class="grid grid-6"></div>

    <div class="info" style="margin-top:12px;">
      <div class="chip" id="attemptsChip">Attempts left: 6</div>
      <div class="chip" id="time2Chip">Time: 40</div>
    </div>

    <button class="btn" id="nextTo3Btn" style="display:none;margin-top:12px;">Go to Level 3</button>
  </section>

  <!-- LEVEL 3 -->
  <section id="level3" class="stage">
    <h2 style="font-size:20px;">Level 3 — Heart Chase</h2>
    <div id="arena"></div>
    <div class="info">
      <div class="chip">Hearts: <span id="heartsCount">0</span>/12</div>
      <div class="chip">Strikes: <span id="strikes">0</span>/5</div>
      <div class="chip" id="time3Chip">Time: 40s</div>
    </div>
  </section>

  <!-- FINAL SCREEN -->
  <section id="finalScreen">
    <div class="finalCard">
      <div class="finalText">🎀💗 Happiest birthday babiee 💗🎀</div>
      <div style="font-size:18px;color:#7a425f;margin-top:8px">I love you sooo much 💞✨</div>
      <button class="btn" onclick="restartAll()" style="margin-top:14px;">Play again</button>
    </div>
  </section>

<script>/* SPARKLES */
const sparkleEmoji = ['✨','💫','🌟'];
function spawnSparkle(){
  const el=document.createElement('div');
  el.className='sparkle';
  el.textContent=sparkleEmoji[Math.random()*sparkleEmoji.length|0];
  el.style.left=(Math.random()*90)+'%';
  el.style.top=(Math.random()*70)+'%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}
setInterval(spawnSparkle,800);

const q=id=>document.getElementById(id);

/* LEVEL 1 */
const emojisL1=['🎂','🧁','🍪','🍩','🍓','🍰','🍬','🍭'];
let first=null, second=null, lock=false, matches=0, moves=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildLevel1(){
  const grid=q('grid1'); grid.innerHTML='';
  matches=0; moves=0; q('movesChip').textContent='Moves: 0';
  const arr=shuffle([...emojisL1,...emojisL1]);

  arr.forEach(em=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<div class="face front">❓</div><div class="face back">${em}</div>`;
    c.dataset.emoji=em;
    c.onclick=()=>flipCard(c);
    grid.appendChild(c);
  });
}

function flipCard(c){
  if(lock||c.classList.contains('flipped'))return;
  c.classList.add('flipped');
  if(!first){first=c; return;}
  second=c; moves++; q('movesChip').textContent='Moves: '+moves;
  checkMatch();
}

function checkMatch(){
  if(first.dataset.emoji===second.dataset.emoji){
    matches++;
    setTimeout(()=>{
      first.style.visibility='hidden';
      second.style.visibility='hidden';
      first=null; second=null;
      if(matches===8) level1Done();
    },400);
  } else {
    lock=true;
    setTimeout(()=>{
      first.classList.remove('flipped');
      second.classList.remove('flipped');
      first=null; second=null; lock=false;
    },700);
  }
}

function level1Done(){
  q('nextTo2Btn').style.display='inline-block';
  q('levelChip').textContent='Level 1 — done!';
}

/* LEVEL 2 */
let target='🎂', attempts=6, t2=40, t2int=null;

function startLevel2Actual(){
  q('level1').classList.remove('active');
  q('level2').classList.add('active');
  q('levelChip').textContent='Level 2';

  attempts=6; t2=40;
  q('attemptsChip').textContent='Attempts left: 6';
  q('time2Chip').textContent='Time: 40';

  const targets=['🎂','🧁','🍰'];
  target=targets[Math.random()*targets.length|0];
  q('targetLabel').textContent=target;

  const grid=q('grid2'); grid.innerHTML='';

  const total=36;
  const pos= Math.random()*total|0;

  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='small-emoji';
    if(i===pos){
      d.textContent=target;
      d.dataset.ok=1;
    } else {
      const pool=['🧁','🍰','🍪','🍩','🍫','🍬','🍭','🍨','🍧','🍦','🍯','🍒','🍓','🍮'];
      d.textContent=pool[Math.random()*pool.length|0];
    }
    d.onclick=()=>pickL2(d);
    grid.appendChild(d);
  }

  if(t2int)clearInterval(t2int);
  t2int=setInterval(()=>{
    t2--; q('time2Chip').textContent='Time: '+t2;
    if(t2<=0){
      clearInterval(t2int);
      alert("Time's up! Try again 💗");
      startLevel2Actual();
    }
  },1000);
}

function pickL2(el){
  if(el.dataset.ok){
    clearInterval(t2int);
    q('nextTo3Btn').style.display='inline-block';
    q('attemptsChip').textContent='Found it! 🎉';
    return;
  }
  attempts--;
  q('attemptsChip').textContent='Attempts left: '+attempts;
  el.style.opacity='0.4';
  el.style.pointerEvents='none';
  if(attempts<=0){
    clearInterval(t2int);
    alert("Out of attempts! Try again 💫");
    startLevel2Actual();
  }
}

/* LEVEL 3 */
const arena=q('arena');
let h=0, s=0, t3=40, intA=null, intM=null, intT=null;

function startLevel3Actual(){
  q('level2').classList.remove('active');
  q('level3').classList.add('active');
  q('levelChip').textContent='Level 3';
  arena.innerHTML=''; h=0; s=0; t3=40;
  q('heartsCount').textContent=h;
  q('strikes').textContent=s;
  q('time3Chip').textContent='Time: 40s';

  intA=setInterval(spawnObj,700);
  intM=setInterval(moveObjs,50);
  intT=setInterval(()=>{
    t3--; q('time3Chip').textContent='Time: '+t3+'s';
    if(t3<=0) end3(false);
  },1000);
}

function rnd(a,b){return a+Math.random()*(b-a);}

function spawnObj(){
  const ok=Math.random()<0.55;
  const d=document.createElement('div');
  d.className='floating';
  d.style.left=rnd(5,85)+'%';
  d.style.top=rnd(5,85)+'%';
  d.dataset.vx=(Math.random()>0.5?1:-1)*(0.6+Math.random()*1.6);
  d.dataset.vy=(Math.random()>0.5?1:-1)*(0.6+Math.random()*1.6);

  if(ok){
    d.textContent='💗';
    d.dataset.type='heart';
  } else {
    const wrong=['💀','👾','🍕','🍪','🔥','🐱','🍓','👀'];
    d.textContent=wrong[Math.random()*wrong.length|0];
    d.dataset.type='bad';
  }

  d.onclick=e=>{
    e.stopPropagation();
    if(d.dataset.type==='heart'){
      h++; q('heartsCount').textContent=h;
      d.remove();
      if(h>=12) end3(true);
    } else {
      s++; q('strikes').textContent=s;
      t3=Math.max(0,t3-4);
      q('time3Chip').textContent='Time: '+t3+'s';
      d.remove();
      if(s>=5) end3(false);
    }
  };
  arena.appendChild(d);
  setTimeout(()=>d.remove(),9000);
}

function moveObjs(){
  [...arena.children].forEach(o=>{
    let l=parseFloat(o.style.left), t=parseFloat(o.style.top);
    let vx=parseFloat(o.dataset.vx), vy=parseFloat(o.dataset.vy);
    l+=vx; t+=vy;
    if(l<2){ l=2; o.dataset.vx=Math.abs(vx);}
    if(l>94){l=94; o.dataset.vx=-Math.abs(vx);}
    if(t<2){ t=2; o.dataset.vy=Math.abs(vy);}
    if(t>94){t=94; o.dataset.vy=-Math.abs(vy);}
    o.style.left=l+'%';
    o.style.top=t+'%';
  });
}

function end3(ok){
  clearInterval(intA); clearInterval(intM); clearInterval(intT);
  if(ok){
    q('level3').classList.remove('active');
    q('finalScreen').style.display='block';
  } else {
    alert("Try again 💗");
    startLevel3Actual();
  }
}

/* RESTART */
function restartAll(){
  clearInterval(intA);clearInterval(intM);clearInterval(intT);
  clearInterval(t2int);

  q('finalScreen').style.display='none';
  q('nextTo2Btn').style.display='none';
  q('nextTo3Btn').style.display='none';

  q('level3').classList.remove('active');
  q('level2').classList.remove('active');
  q('level1').classList.add('active');

  q('levelChip').textContent='Level 1';

  buildLevel1();
}

/* BUTTON HOOKS */
q('nextTo2Btn').onclick = startLevel2Actual;
q('nextTo3Btn').onclick = startLevel3Actual;

/* INIT */
buildLevel1();
</script>
</main>
</body>
</html>
