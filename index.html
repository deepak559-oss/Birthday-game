<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Game 🎂💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    margin:0;
    text-align:center;
    font-family:"Comic Sans MS",cursive;
    background:linear-gradient(135deg,#ffe1f0,#ffd7fa);
    color:#d12c78;
    overflow-x:hidden;
    position:relative;
}
h1{margin-top:15px;font-size:32px;}
.screen{display:none;padding:20px;}
.active{display:block;}
.btn{
    background:#ff4fa3;color:white;border:none;
    padding:12px 20px;border-radius:12px;cursor:pointer;
    font-size:18px;margin-top:10px;
}
.level-btn{
    background:white;padding:15px;border-radius:14px;
    font-size:20px;display:inline-block;margin:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);cursor:pointer;
    opacity:0.5;
}
.level-btn.unlocked{opacity:1;}
.grid{
    display:grid;grid-template-columns:repeat(4,70px);
    gap:10px;justify-content:center;
}
.card{
    width:70px;height:70px;background:white;
    border-radius:10px;cursor:pointer;
    font-size:36px;display:flex;
    justify-content:center;align-items:center;
}
.fallHeart{
    position:absolute;font-size:40px;
    cursor:pointer;
}
#gift{
    font-size:120px;cursor:pointer;
    animation:shake 1s infinite;
}
.message{
    font-size:40px;
    color:#ff2e8e;
    margin-top:20px;
    font-weight:bold;
    line-height:1.4;
}
.confetti{
    position:fixed;width:15px;height:15px;background:random;
    top:0;left:0;z-index:9999;pointer-events:none;
    border-radius:50%;animation:confettiFall 3s linear forwards;
}
@keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(110vh) rotate(360deg);}
}
/* Floating stickers */
.sticker{
    position:fixed;font-size:30px;
    top:0;left:0;
    animation:floatSticker linear infinite;
    pointer-events:none;
    opacity:0.8;
}
@keyframes floatSticker{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(100vh) rotate(360deg);}
}
</style>
</head>
<body>

<!-- Music -->
<audio id="music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4af7e5cc1b.mp3?filename=happy-birthday-to-you-piano-10992.mp3" type="audio/mpeg">
</audio>

<!-- Home Screen -->
<div id="home" class="screen active">
    <h1>🎉 Hard Mode Birthday Game 💖</h1>
    <button class="btn" onclick="startMusic()">▶ Play Birthday Music</button>
    <h2>Select Level 🎮</h2>
    <div>
        <div class="level-btn unlocked" id="lv1" onclick="startLevel(1)">Level 1</div>
        <div class="level-btn" id="lv2" onclick="unlockCheck(2)">Level 2</div>
        <div class="level-btn" id="lv3" onclick="unlockCheck(3)">Level 3</div>
        <div class="level-btn" id="lv4" onclick="unlockCheck(4)">Level 4</div>
        <div class="level-btn" id="lv5" onclick="unlockCheck(5)">Level 5</div>
    </div>
</div>

<!-- Level Screen -->
<div id="levelScreen" class="screen">
    <h1 id="title"></h1>
    <div id="content" style="position:relative; height:60vh;"></div>
    <button class="btn" onclick="home()">Back</button>
</div>

<!-- Surprise Screen -->
<div id="surprise" class="screen">
    <h1>🎁 Tap the Gift!</h1>
    <div id="gift" onclick="openGift()">🎁</div>
    <div id="finalMsg" class="message"></div>
</div>

<script>
let unlockedLevels = [1];

function show(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function startMusic(){
    const audio = document.getElementById("music");
    audio.volume = 0.5;
    audio.loop = true;
    audio.play().catch(()=>alert("Click allowed to start music 🎶"));
}

function home(){ show("home"); updateLevelButtons(); }

function updateLevelButtons(){
    for(let i=1;i<=5;i++){
        let btn=document.getElementById("lv"+i);
        if(unlockedLevels.includes(i)){
            btn.classList.add("unlocked");
        } else{
            btn.classList.remove("unlocked");
        }
    }
}

function unlockCheck(level){
    if(unlockedLevels.includes(level)){
        startLevel(level);
    } else{
        alert("Complete previous levels first! 💖");
    }
}

function startLevel(n){
    show("levelScreen");
    document.getElementById("title").innerText = "Level " + n;
    if(n===1) level1();
    if(n===2) level2();
    if(n===3) level3(); // Whack-a-Emoji
    if(n===4) level4();
    if(n===5) level5();
}

/* Level 1: Memory 16 cards */
function level1(){
    let emojis=["💖","💖","😍","😍","😘","😘","🐻","🐻","💗","💗","💕","💕","✨","✨","🌸","🌸"];
    emojis.sort(()=>Math.random()-0.5);
    let html="<div class='grid'>";
    emojis.forEach((e,i)=> html+=`<div class='card' id='c${i}' onclick='flip(${i},"${e}",1)'>?</div>`);
    html+="</div>";
    document.getElementById("content").innerHTML=html;
    window.first=null; window.second=null; window.matched=0;
}
function flip(id,emoji,level){
    let card=document.getElementById("c"+id);
    if(card.innerText!=="?") return;
    card.innerText=emoji;
    if(!first) first={id,emoji};
    else{
        second={id,emoji};
        setTimeout(()=>{
            if(first.emoji===second.emoji){
                matched+=2; createConfetti(); createSticker();
                if(level===1 && matched===16){
                    if(!unlockedLevels.includes(2)) unlockedLevels.push(2);
                    updateLevelButtons(); startLevel(2);
                }
            }else{
                document.getElementById("c"+first.id).innerText="?";
                document.getElementById("c"+second.id).innerText="?";
            }
            first=null; second=null;
        },600);
    }
}

/* Level 2: Find target in 100 emojis */
function level2(){
    let target="💗";
    let html="<h3>FIND: 💗 (Only ONE correct!) 🌸✨💞</h3>";
    for(let i=0;i<100;i++){
        let e=Math.random()<0.03?target:["✨","🌸","💞","⭐","💖","💕"][Math.floor(Math.random()*6)];
        html+=`<span onclick='findCheck("${e}")' style='font-size:28px;margin:4px;cursor:pointer;'>${e}</span>`;
    }
    document.getElementById("content").innerHTML=html;
}
function findCheck(e){
    if(e==="💗"){
        if(!unlockedLevels.includes(3)) unlockedLevels.push(3);
        updateLevelButtons(); createConfetti(); createSticker(); startLevel(3);
    }
}

/* Level 3: Whack-a-Emoji */
function level3(){
    document.getElementById("content").innerHTML="<h3>Whack 7 💖!</h3>";
    let targetCount = 0;
    let totalTarget = 7;
    const area = document.getElementById("content");

    function spawnEmoji(){
        let emoji = Math.random()<0.5?"💖":"💀";
        let div = document.createElement("div");
        div.className="fallHeart";
        div.innerText = emoji;
        div.style.top = Math.random()*50+"%";
        div.style.left = Math.random()*85+"%";
        area.appendChild(div);
        setTimeout(()=>div.remove(), 1500);
        div.onclick = ()=>{
            if(emoji==="💖"){
                targetCount++;
                createConfetti(); createSticker(); div.remove();
                if(targetCount>=totalTarget){
                    if(!unlockedLevels.includes(4)) unlockedLevels.push(4);
                    updateLevelButtons(); startLevel(4);
                }
            } else {
                alert("Oops! Wrong emoji! Try again.");
                targetCount=0;
            }
        };
    }
    // Spawn emojis every 600ms
    window.level3Interval = setInterval(spawnEmoji, 600);
}

/* Level 4: Tap 30 hearts fast */
function level4(){
    document.getElementById("content").innerHTML="<h3>Tap 30 ❤️ FAST!</h3>";
    for(let i=0;i<30;i++){
        let heart=document.createElement("span");
        heart.innerText="❤️"; heart.style.fontSize="32px"; heart.style.cursor="pointer"; heart.style.margin="5px";
        if(Math.random()<0.3) setTimeout(()=>heart.remove(),Math.random()*2000+800);
        heart.onclick=function(){ heart.remove();
            if(document.querySelectorAll("#content span").length===0){
                if(!unlockedLevels.includes(5)) unlockedLevels.push(5);
                updateLevelButtons(); createConfetti(); createSticker(); startLevel(5);
            }
        };
        document.getElementById("content").appendChild(heart);
    }
}

/* Level 5: Hard Mini-Game (Click stickers in sequence) */
function level5(){
    document.getElementById("content").innerHTML="<h3>Click the stickers in this order:</h3><div id='seq'></div><div id='player'></div>";
    let sequence=["🌸","💖","✨","💞","🐻"];
    let seqDiv=document.getElementById("seq");
    sequence.forEach(e=>{ let s=document.createElement("span"); s.innerText=e; s.style.fontSize="36px"; s.style.margin="6px"; seqDiv.appendChild(s); });
    let index=0;
    function addSticker(s){
        let btn=document.createElement("span"); btn.innerText=s; btn.style.fontSize="36px"; btn.style.margin="6px"; btn.style.cursor="pointer";
        btn.onclick=function(){
            if(s===sequence[index]){ index++; createSticker();
                if(index===sequence.length){ alert("Level 5 complete!"); unlockedLevels.push(6); updateLevelButtons(); showSurprise(); }
            }else{ alert("Wrong! Try again."); index=0; }
        };
        document.getElementById("player").appendChild(btn);
    }
    sequence.concat(["🌟","🎀","💗","✨"]).forEach(addSticker);
}

function showSurprise(){ show("surprise"); }

function openGift(){
    document.getElementById("gift").style.display="none";
    document.getElementById("finalMsg").innerHTML=
        "🎉💖 HAPPIEST BIRTHDAY BABIEE 💖🎉<br>I LOVE YOU SOOO MUCH<br>kuchiipuchiii nonii kukkiiiiii 😘😘😘💖💖💖";
    for(let i=0;i<100;i++) createConfetti();
    for(let i=0;i<20;i++) createSticker();
}

/* Confetti */
function createConfetti(){
    let c=document.createElement("div"); c.className="confetti"; c.style.background=randomColor();
    c.style.left=Math.random()*100+"vw"; c.style.width=c.style.height=5+Math.random()*10+"px";
    document.body.appendChild(c); setTimeout(()=>c.remove(),3000);
}

/* Stickers */
function createSticker(){
    const stickers=["🌸","💖","✨","🌟","💞","🐻","🎀"];
    let s=document.createElement("div"); s.className="sticker"; s.innerText=stickers[Math.floor(Math.random()*stickers.length)];
    s.style.left=Math.random()*90+"vw"; s.style.fontSize=20+Math.random()*20+"px"; s.style.animationDuration=3+Math.random()*2+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),3000);
}

function randomColor(){ let colors=["#ff5eeb","#ff8c42","#ffc93c","#42f5b1","#4287f5"]; return colors[Math.floor(Math.random()*colors.length)]; }
</script>
</body>
</html>
