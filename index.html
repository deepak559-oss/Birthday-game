<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Game 🎂💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: "Comic Sans MS", cursive;
    background: linear-gradient(135deg, #ffe1f0, #ffd7fa);
    text-align: center;
    color: #d12c78;
}
h1 { margin-top: 20px; font-size: 32px; }

.screen { display: none; padding: 20px; }
.active { display: block; }

/* Buttons */
.btn {
    background: #ff4fa3;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 18px;
    margin-top: 15px;
}
.level-btn {
    background: white;
    padding: 15px;
    border-radius: 14px;
    font-size: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    cursor: pointer;
    margin: 10px;
    display: inline-block;
}

/* Memory cards */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 70px);
    gap: 10px;
    justify-content: center;
}
.card {
    width: 70px; height: 70px;
    background: white;
    border-radius: 10px;
    font-size: 35px;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer;
}

/* Surprise Screen */
#giftBox {
    font-size: 120px;
    animation: shake 1s infinite;
    cursor: pointer;
}
@keyframes shake {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(3deg); }
  50% { transform: rotate(-3deg); }
  100%{ transform: rotate(0deg); }
}
.message {
    font-size: 26px;
    margin-top: 20px;
    color: #ff2e8e;
}
</style>
</head>
<body>

<!-- AUDIO -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4af7e5cc1b.mp3?filename=happy-birthday-to-you-piano-10992.mp3" type="audio/mpeg">
</audio>

<!-- HOME -->
<div id="home" class="screen active">
    <h1>🎉 Birthday Game 💗</h1>
    <button class="btn" onclick="startMusic()">▶ Play Birthday Song</button>

    <h2>Select a Level 🎮</h2>
    <div>
        <div class="level-btn" onclick="startLevel(1)">Level 1</div>
        <div class="level-btn" onclick="startLevel(2)">Level 2</div>
        <div class="level-btn" onclick="startLevel(3)">Level 3</div>
        <div class="level-btn" onclick="startLevel(4)">Level 4</div>
        <div class="level-btn" onclick="startLevel(5)">Level 5</div>
    </div>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen" class="screen">
    <h1 id="levelTitle"></h1>
    <div id="levelContent"></div>
    <button class="btn" onclick="goHome()">Back</button>
</div>

<!-- SURPRISE SCREEN -->
<div id="surprise" class="screen">
    <h1>🎁 Tap the Gift!</h1>
    <div id="giftBox" onclick="openGift()">🎁</div>
    <div id="finalMessage" class="message"></div>
</div>

<script>
function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startMusic(){
    document.getElementById("music").play();
}

function goHome(){
    show("home");
}

/* Start Level */
function startLevel(n){
    show("levelScreen");
    document.getElementById("levelTitle").innerText = "Level " + n;

    if(n === 1) loadLevel1();
    if(n === 2) loadLevel2();
    if(n === 3) loadLevel3();
    if(n === 4) loadLevel4();
    if(n === 5) loadLevel5();
}

/* ---------------- LEVEL 1 : Memory Game ---------------- */
function loadLevel1(){
    let emojis = ["💖","💖","😍","😍","😘","😘","🐻","🐻"];
    emojis.sort(() => Math.random()-0.5);

    let html = "<div class='cards'>";
    emojis.forEach((e,i)=> html += `<div class='card' id='c${i}' onclick='flip(${i},"${e}")'>?</div>`);
    html += "</div>";
    document.getElementById("levelContent").innerHTML = html;

    window.first = null;
    window.second = null;
    window.matched = 0;
}

function flip(id, emoji){
    let card = document.getElementById("c"+id);
    if(card.innerText !== "?") return;

    card.innerText = emoji;

    if(!first) first = {id,emoji};
    else {
        second = {id,emoji};
        setTimeout(()=>{
            if(first.emoji === second.emoji){
                matched += 2;
                if(matched === 8) setTimeout(()=>startLevel(2),600);
            } else {
                document.getElementById("c"+first.id).innerText = "?";
                document.getElementById("c"+second.id).innerText = "?";
            }
            first = null; second = null;
        },600);
    }
}

/* ---------------- LEVEL 2: Find Emoji ---------------- */
function loadLevel2(){
    let target = "💗";
    let grid = "";
    for(let i=0; i<40; i++){
        let e = (Math.random() < .1) ? target : "✨";
        grid += `<span style='font-size:30px; margin:5px; cursor:pointer;' onclick='checkEmoji("${e}")'>${e}</span>`;
    }
    document.getElementById("levelContent").innerHTML =
        "<h3>Find this: 💗</h3>" + grid;
}

function checkEmoji(e){
    if(e === "💗"){
        startLevel(3);
    }
}

/* ---------------- LEVEL 3: Tap Hearts ---------------- */
function loadLevel3(){
    let hearts = "";
    for(let i=0; i<15; i++){
        hearts += `<span onclick='tapHeart(this)' style='font-size:35px; margin:8px; cursor:pointer;'>💖</span>`;
    }
    document.getElementById("levelContent").innerHTML = 
        "<h3>Tap all the 💖 hearts!</h3>" + hearts;
}
function tapHeart(el){
    el.remove();
    if(document.querySelectorAll("#levelContent span").length === 0){
        startLevel(4);
    }
}

/* ---------------- LEVEL 4: Avoid Wrong Emoji ---------------- */
function loadLevel4(){
    document.getElementById("levelContent").innerHTML =
        "<h3>Tap ONLY ❤️ — avoid 💀</h3>";

    for(let i=0;i<20;i++){
        let good = Math.random()<.5;
        let e = good ? "❤️" : "💀";
        document.getElementById("levelContent").innerHTML +=
            `<span onclick='chooseEmoji("${e}")' style='font-size:40px; margin:7px; cursor:pointer;'>${e}</span>`;
    }
}
function chooseEmoji(e){
    if(e==="💀"){
        alert("Oops! Try again 😭");
        startLevel(4);
        return;
    }
    let left = document.querySelectorAll("#levelContent span");
    if(left.length <= 1){
        startLevel(5);
    }
}

/* ---------------- LEVEL 5: Final gift ---------------- */
function loadLevel5(){
    document.getElementById("levelContent").innerHTML =
        "<h2>You're almost there! 🎀</h2><p>Tap the button for your surprise!</p><button class='btn' onclick='showSurprise()'>🎁 Show Surprise</button>";
}

function showSurprise(){
    show("surprise");
}

/* ---------------- Surprise ---------------- */
function openGift(){
    document.getElementById("giftBox").style.display = "none";
    document.getElementById("finalMessage").innerHTML =
        "Happiest birthday babiee I love you sooo much kuchiipuchiii nonii kukkiiiiii 😘😘😘😘💖💖💖";
}
</script>

</body>
</html>
